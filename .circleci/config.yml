version: 2.1

orbs:
  node: circleci/node@7.2.1
  rust: circleci/rust@2.0.0

executors:
  # Machine executor because the backend's integration tests use testcontainers,
  # which needs a real local Docker daemon (remote-docker can't map the container's
  # port to localhost). The same executor also builds the frontend and Rust crate.
  turbo:
    machine:
      image: ubuntu-2404:current
    resource_class: medium

commands:
  setup:
    steps:
      - checkout
      # Node version comes from .nvmrc; pnpm version from package.json's packageManager.
      - node/install:
          install-pnpm: true
          pnpm-version: 11.3.0
      - node/install-packages:
          pkg-manager: pnpm
      - rust/install
      - run:
          name: Ensure clippy is installed
          command: rustup component add clippy

jobs:
  build:
    executor: turbo
    steps:
      - setup
      - run:
          name: Build (turbo)
          command: pnpm run build

  lint:
    executor: turbo
    steps:
      - setup
      - run:
          name: Lint (turbo)
          command: pnpm run lint

  check-types:
    executor: turbo
    steps:
      - setup
      - run:
          name: Check types (turbo)
          command: pnpm run check-types

  coverage:
    executor: turbo
    # Coverage runs the full test suite (incl. backend testcontainers) plus
    # instrumentation, so give this job more headroom than the medium default.
    resource_class: large
    steps:
      - setup
      - run:
          name: Install cargo-llvm-cov
          command: |
            rustup component add llvm-tools-preview
            curl --proto '=https' --tlsv1.2 -fsSL https://github.com/taiki-e/cargo-llvm-cov/releases/latest/download/cargo-llvm-cov-x86_64-unknown-linux-gnu.tar.gz | tar xzf - -C "$HOME/.cargo/bin"
      - run:
          name: Test + coverage gate (turbo)
          command: pnpm run test:coverage
      - run:
          name: Generate HTML coverage report
          command: cd apps/backend && cargo llvm-cov report --ignore-filename-regex 'src/main\.rs' --html
      - store_artifacts:
          path: apps/backend/target/llvm-cov/html
          destination: coverage

workflows:
  ci:
    jobs:
      - build
      - lint
      - check-types
      - coverage
