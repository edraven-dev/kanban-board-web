[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "=0.1.89"
axum = "=0.8.9"
chrono = { version = "=0.4.45", default-features = false, features = ["serde", "clock"] }
dotenvy = "=0.15.7"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
sqlx = { version = "=0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "macros", "migrate"] }
thiserror = "=2.0.18"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "net"] }
tower-http = { version = "=0.7.0", features = ["cors"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
utoipa = "=5.5.0"
utoipa-axum = "=0.2.0"
utoipa-swagger-ui = { version = "=9.0.2", features = ["axum"] }
uuid = { version = "=1.23.4", features = ["v7", "serde"] }

[dev-dependencies]
testcontainers = "=0.27.3"
testcontainers-modules = { version = "=0.15.0", features = ["postgres"] }
tower = { version = "=0.5.3", features = ["util"] }
